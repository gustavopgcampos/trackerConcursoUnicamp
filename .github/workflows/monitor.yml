name: Monitor UNICAMP

on:
  workflow_dispatch:
  schedule:
    # Executa a cada hora. Os horários do GitHub Actions usam UTC.
    - cron: "0 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Restaurar estado anterior
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: |
            monitor-state-

      - name: Executar monitor
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py --run-once

      - name: Salvar estado atualizado
        uses: actions/cache/save@v4
        if: always() && hashFiles('state.json') != ''
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}
